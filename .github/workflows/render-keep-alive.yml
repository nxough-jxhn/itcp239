name: Render Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail
          URL="${RENDER_HEALTH_URL:-https://peakplay-backend.onrender.com/api/v1/health}"
          echo "Pinging: $URL"
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 "$URL"
